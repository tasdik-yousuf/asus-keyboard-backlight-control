# kbd-backlight-idle configuration
# Installed to /etc/kbd-backlight-idle.conf — edit values, no need to touch the script.

# LED device name as reported by `brightnessctl -l`
DEVICE="asus::kbd_backlight"

# Seconds of no keypresses before the backlight turns off
IDLE_TIMEOUT=10

# Only used if the backlight is already off when the service starts,
# since there's no "last set level" to remember yet.
FALLBACK_LEVEL="50%"
